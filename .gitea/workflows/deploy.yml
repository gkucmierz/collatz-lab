name: Build and Deploy (collatz-lab)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy (collatz-lab)
    runs-on: self-hosted-pl
    timeout-minutes: 15
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Wait for @gkucmierz/* dependencies (NPM & Gitea Packages)
        uses: gkucmierz/ci-workflows/wait-for-deps@main
        with:
          timeout_sec: '180'

      - name: Zero-Downtime SPA Build & Nginx Hot-Swap
        uses: gkucmierz/ci-workflows/zero-downtime-swap@main
        with:
          container_name: collatz-lab
          hot_swap_static: 'true'
          healthcheck_url: 'http://localhost:45099/'
